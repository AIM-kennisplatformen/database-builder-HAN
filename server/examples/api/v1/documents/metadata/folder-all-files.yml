info:
  name: folder all files
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/{{api_version}}/documents/metadata"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: text/event-stream
  body:
    type: json
    data: |-
      {
        "drive_id": "{{drive_id}}",
        "include_paths": ["Reports/"],
        "exclude_paths": ["Reports/Drafts/"]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
