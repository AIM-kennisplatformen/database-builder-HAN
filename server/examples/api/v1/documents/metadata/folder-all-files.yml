info:
  name: folder all files
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/{{api_version}}/documents/groups/{{group_id}}/metadata"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: text/event-stream
  body:
    type: json
    data: |-
      {
        "include": [
          {
            "drive_id": "{{drive_id}}",
            "paths": ["Reports/"],
            "extensions": ["pdf"]
          }
        ],
        "exclude": [
          {
            "drive_id": "{{drive_id}}",
            "paths": ["Reports/Drafts/"],
            "extensions": ["xlsx"]
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
