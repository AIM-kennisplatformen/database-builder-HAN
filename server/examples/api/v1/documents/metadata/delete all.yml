info:
  name: delete all document metadata (global reset)
  type: http
  seq: 4
  description: Destructive global reset of every user's metadata inventory. Requires DELETE_ENDPOINTS__METADATA=true and a server restart.

http:
  method: DELETE
  url: "{{base_url}}/{{api_version}}/documents/metadata"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
