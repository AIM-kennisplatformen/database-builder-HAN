info:
  name: all files
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/{{api_version}}/documents/metadata"
  body:
    type: json
    data: |-
      {
        "drive_id": "{{drive_id}}",
        "extensions": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
