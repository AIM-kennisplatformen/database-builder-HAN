[project]
name = "management-api"
version = "0.1.0"
description = "HAN management API and ingestion application"
readme = "README.md"
authors = [
    { name = "Simon Dingemans", email = "simon.dingemans@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.16,<2",
    "azure-identity>=1,<2",
    "pydantic-settings>=2,<3",
    "fastapi[standard]>=0.115,<1",
    "httpx>=0.27,<1",
    "msgraph-sdk>=1,<2",
    "openpyxl>=3.1,<4",
    "psycopg[binary,pool]>=3.2,<4",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.30,<1",
    "dotenv>=0.9.9",
]

[tool.uv]
package = false

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["%(here)s/src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.basedpyright]
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
allowedUntypedLibraries = ["msal", "msgraph"]

executionEnvironments = [
  { root = "tests", extraPaths = ["src"], reportAny = false, reportExplicitAny = false, reportMissingTypeStubs = false, reportUnusedCallResult = false },
  { root = "src" },
  { root = "migrations", extraPaths = ["src"], reportUnusedCallResult = false }
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "poethepoet>=0.37,<1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.poe.tasks]
migrate-up = "alembic -c pyproject.toml upgrade head"
migrate-down = "alembic -c pyproject.toml downgrade -1"

lint = "ruff check --fix"
fmt = "ruff format"
typecheck = "basedpyright"
check = ["lint", "fmt", "typecheck"]

start = "uvicorn main:app --app-dir src --env-file ../.env --host 127.0.0.1 --port 8001 --reload"
