name: Type checking

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  basedpyright:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.15"
      - name: Check API types
        working-directory: api
        run: uv run --locked basedpyright
