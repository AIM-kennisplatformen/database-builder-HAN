name: Guidebook

on:
  pull_request:
    paths:
      - book.toml
      - docs/software-guidebook/**
      - .github/workflows/guidebook.yml
  push:
    branches:
      - main
    paths:
      - book.toml
      - docs/software-guidebook/**
      - .github/workflows/guidebook.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install mdBook 0.5.4
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/mdbook.tar.gz"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP" mdbook
      - name: Build guidebook
        run: |
          "$RUNNER_TEMP/mdbook" build
