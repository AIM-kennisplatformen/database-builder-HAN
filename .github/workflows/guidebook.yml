name: Documentation

on:
  pull_request:
    paths:
      - book.toml
      - docs/software-guidebook/**
      - .agents/skills/software-guidebook/**
      - .github/workflows/guidebook.yml
  push:
    branches:
      - main
    paths:
      - book.toml
      - docs/software-guidebook/**
      - .agents/skills/software-guidebook/**
      - .github/workflows/guidebook.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install mdBook 0.5.4
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz \
            --output "$RUNNER_TEMP/mdbook.tar.gz"
          tar -xzf "$RUNNER_TEMP/mdbook.tar.gz" -C "$RUNNER_TEMP" mdbook
      - name: Install PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y plantuml
      - name: Install mdbook-plantuml 2.0.0
        run: |
          cargo install mdbook-plantuml --version 2.0.0 --locked --root "$RUNNER_TEMP/mdbook-plantuml"
          echo "$RUNNER_TEMP/mdbook-plantuml/bin" >> "$GITHUB_PATH"
      - name: Build guidebook
        run: |
          "$RUNNER_TEMP/mdbook" build
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: book

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
