name: Server CI

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  push:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: "server/uv.lock"

      - name: Lint (Ruff)
        run: uv run --locked ruff check

      - name: Format (Ruff)
        run: uv run --locked ruff format --check --diff

      - name: Type check (basedpyright)
        run: uv run --locked basedpyright

      - name: Test (pytest)
        run: uv run --locked pytest
