name: Formatting

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Check formatting
        uses: dprint/check@v2.3
        with:
          dprint-version: 0.61.1
